<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"><title>Mi panel - Academia SMIF</title></head>
<body class="bg-light">
<nav class="navbar navbar-dark navbar-smif"><div class="container">
  <a class="brand" href="panel.html">S<span>M</span>IF</a>
  <button id="logoutButton" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
</div></nav>
<main class="container my-4">
  <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
    <h1 id="saludo" class="h2 fw-bold mb-0">Cargando...</h1>
    <span id="rolBadge" class="badge fs-6 text-capitalize text-bg-secondary">...</span>
  </div>

  <div class="card shadow-sm mb-4"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted mb-3">Mis datos</h2>
    <div class="row g-3">
      <div class="col-sm-6"><small class="text-muted d-block">Nombre</small><span id="dNombre"></span></div>
      <div class="col-sm-6"><small class="text-muted d-block">DNI</small><span id="dDni"></span></div>
      <div class="col-sm-6"><small class="text-muted d-block">Correo</small><span id="dEmail"></span></div>
      <div class="col-sm-6"><small class="text-muted d-block">Celular</small><span id="dCelular"></span></div>
      <div class="col-sm-6 only-alumno hidden"><small class="text-muted d-block">Ciclo</small><span id="dCiclo"></span></div>
      <div class="col-sm-6 only-alumno hidden"><small class="text-muted d-block">Modalidad</small><span id="dModalidad" class="text-capitalize"></span></div>
      <div class="col-sm-6 only-docente hidden"><small class="text-muted d-block">Especialidad</small><span id="dEspecialidad"></span></div>
    </div>
  </div></div>

  <div id="secciones" class="row g-3"></div>
  <div id="message" class="d-none"></div>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/panel.js"></script>
</body></html>
