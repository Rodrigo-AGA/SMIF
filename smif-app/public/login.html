<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Ingreso - Academia SMIF</title>
</head>
<body>
<div class="row g-0 min-vh-100">

  <div class="col-lg-6 d-none d-lg-flex split-left">
    <div class="split-left-content text-center text-white">
      <div class="brand brand-lg mb-4">S<span>M</span>IF</div>
      <div class="split-circle mb-4"><span>SMIF</span></div>
      <h2 class="fw-bold">Academia SMIF</h2>
      <p class="lead mb-0">Aula virtual para estudiantes y docentes</p>
    </div>
  </div>

  <!-- Formulario -->
  <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white">
    <div class="w-100 px-4 py-5" style="max-width:440px">
      <div class="brand brand-dark text-center d-lg-none mb-4">S<span>M</span>IF</div>
      <h1 class="h2 fw-bold text-center mb-1">INGRESO</h1>
      <p class="text-center text-muted mb-5">Bienvenidos al aula virtual SMIF</p>

      <form id="loginForm" novalidate>
        <label for="rol" class="visually-hidden">Perfil</label>
        <select id="rol" class="form-select form-select-lg mb-3">
          <option value="alumno" selected>Estudiante</option>
          <option value="docente">Docente</option>
        </select>

        <label for="dni" class="visually-hidden">DNI</label>
        <input type="text" id="dni" class="form-control form-control-lg mb-3"
               inputmode="numeric" maxlength="8" placeholder="Ingrese su DNI" autocomplete="username" required>

        <label for="password" class="visually-hidden">Contraseña</label>
        <input type="password" id="password" class="form-control form-control-lg mb-4"
               placeholder="Contraseña" autocomplete="current-password" required>

        <button type="submit" class="btn btn-smif-azul btn-lg px-5">INGRESAR</button>
      </form>

      <div id="message" class="d-none"></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/login.js"></script>
</body>
</html>
